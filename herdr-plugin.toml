# herdr-plugin.toml - herdr side of nvim-herdr-navigator.
#
# Install from GitHub:
#   herdr plugin install kaar/nvim-herdr-navigator
# Local development (link does not run build steps):
#   herdr plugin link /path/to/nvim-herdr-navigator
#
# Neovim-aware directional pane focus (vim-tmux-navigator pattern):
# Keybindings let h-nav forward ctrl+h/j/k/l to Neovim or fzf.
# Neovim tries its windows first, then calls the same action via the CLI.
# CLI invocations skip key forwarding and focus a pane through h-nav.
# For other processes, including Vim, keybindings also focus panes directly.
# h-nav requires jq to read HERDR_PLUGIN_CONTEXT_JSON.invocation_source.

id = "herdr-navigator"
name = "Herdr Navigator"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Seamless ctrl+h/j/k/l across herdr panes and Neovim splits."
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "h-nav", "--reset"]

[[actions]]
id = "left"
title = "Navigate left (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "left"]

[[actions]]
id = "down"
title = "Navigate down (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "down"]

[[actions]]
id = "up"
title = "Navigate up (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "up"]

[[actions]]
id = "right"
title = "Navigate right (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "right"]
