# herdr-plugin.toml - herdr side of nvim-herdr-navigator.
#
# Install from GitHub:
#   herdr plugin install kaar/nvim-herdr-navigator
# Local development (link does not run build steps):
#   herdr plugin link /path/to/nvim-herdr-navigator
#
# Neovim-aware directional pane focus (vim-tmux-navigator pattern):
# h-nav passes ctrl+h/j/k/l through to Neovim or fzf. The Neovim plugin
# tries its windows first, then requests herdr pane focus at the edge.
# For other processes, including Vim, h-nav moves herdr pane focus directly.

id = "herdr-navigator"
name = "Herdr Navigator"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Seamless ctrl+h/j/k/l across herdr panes and Neovim splits."
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Navigate left (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "left"]

[[actions]]
id = "down"
title = "Navigate down (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "down"]

[[actions]]
id = "up"
title = "Navigate up (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "up"]

[[actions]]
id = "right"
title = "Navigate right (nvim/herdr)"
contexts = ["global"]
command = ["sh", "h-nav", "right"]
